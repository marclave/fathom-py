[project]
name = "fathom-analytics"
version = "0.3.0" # x-release-please-version
description = "Use the API to manage sites, events and milestones, or pull custom reports. The base URL is https://api.usefathom.com/v1."
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Fathom Analytics API" },
]
requires-python = ">= 3.9"
dependencies = [
  "httpx>=0.23.0, <1",
  "pydantic>=1.9.0, <3",
  "typing-extensions>=4.14, <5",
  "anyio>=3.5.0, <5",
  "distro>=1.7.0, <2",
  "sniffio",
]

[project.optional-dependencies]
aiohttp = ["aiohttp", "httpx_aiohttp>=0.1.9"]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_analytics"]

[tool.ruff]
line-length = 120
